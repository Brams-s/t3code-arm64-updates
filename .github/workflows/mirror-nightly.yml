name: Mirror T3 Code ARM64 nightly

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild and replace the newest mirrored release
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "45 */3 * * *"

permissions:
  contents: read

concurrency:
  group: t3code-arm64-nightly
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve newest upstream nightly
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      official_appimage_digest: ${{ steps.release.outputs.official_appimage_digest }}
      official_manifest_digest: ${{ steps.release.outputs.official_manifest_digest }}
      tag: ${{ steps.release.outputs.tag }}
      upstream_sha: ${{ steps.release.outputs.upstream_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        name: Resolve release
        env:
          FEED_REPOSITORY: ${{ github.repository }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_json="$(
            gh api 'repos/pingdotgg/t3code/releases?per_page=30' \
              --jq '[.[] | select(.prerelease == true and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.[0-9]{8}\\.[0-9]+$")))][0]'
          )"
          tag="$(jq -r '.tag_name // empty' <<<"$release_json")"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$ ]]; then
            echo "Could not resolve a valid upstream nightly tag." >&2
            exit 1
          fi

          version="${tag#v}"
          upstream_sha="$(jq -r '.target_commitish // empty' <<<"$release_json")"
          if [[ ! "$upstream_sha" =~ ^[0-9a-f]{40}$ ]]; then
            upstream_sha="$(gh api "repos/pingdotgg/t3code/commits/${tag}" --jq '.sha')"
          fi

          official_appimage="T3-Code-${version}-arm64.AppImage"
          official_manifest="nightly-linux-arm64.yml"
          official_appimage_digest="$(
            jq -r --arg name "$official_appimage" \
              '[.assets[] | select(.name == $name) | .digest][0] // empty' \
              <<<"$release_json"
          )"
          official_manifest_digest="$(
            jq -r --arg name "$official_manifest" \
              '[.assets[] | select(.name == $name) | .digest][0] // empty' \
              <<<"$release_json"
          )"

          if [[ "$official_appimage_digest" =~ ^sha256:[0-9a-f]{64}$ && \
                "$official_manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            mirrored_release_json="$(
              gh api "repos/${FEED_REPOSITORY}/releases/tags/${tag}" 2>/dev/null || true
            )"
            if [[ -z "$mirrored_release_json" ]]; then
              mirrored_release_json='{}'
            fi
            mirrored_appimage_digest="$(
              jq -r --arg name "$official_appimage" \
                '[.assets[]? | select(.name == $name) | .digest][0] // empty' \
                <<<"$mirrored_release_json"
            )"
            mirrored_manifest_digest="$(
              jq -r --arg name "$official_manifest" \
                '[.assets[]? | select(.name == $name) | .digest][0] // empty' \
                <<<"$mirrored_release_json"
            )"
            if [[ "$FORCE_REBUILD" == "true" || \
                  "$mirrored_appimage_digest" != "$official_appimage_digest" || \
                  "$mirrored_manifest_digest" != "$official_manifest_digest" ]]; then
              mode=official
              echo "Release $tag has an official Linux ARM64 build; prepare updater handoff."
            else
              mode=skip
              echo "Official Linux ARM64 release $tag is already mirrored."
            fi
          elif gh release view "$tag" --repo "$FEED_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$FORCE_REBUILD" == "true" ]]; then
              mode=build
              echo "Release $tag will be rebuilt and replaced."
            else
              mode=skip
              echo "Release $tag is already mirrored."
            fi
          else
            mode=build
            echo "Release $tag needs an ARM64 build."
          fi

          {
            echo "mode=$mode"
            echo "official_appimage_digest=$official_appimage_digest"
            echo "official_manifest_digest=$official_manifest_digest"
            echo "tag=$tag"
            echo "upstream_sha=$upstream_sha"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

  build:
    name: Build Linux ARM64 AppImage
    needs: resolve
    if: needs.resolve.outputs.mode == 'build'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out feed repository
        uses: actions/checkout@v6

      - name: Check out exact upstream tag
        uses: actions/checkout@v6
        with:
          repository: pingdotgg/t3code
          ref: ${{ needs.resolve.outputs.tag }}
          path: source
          fetch-depth: 1

      - name: Verify upstream commit
        working-directory: source
        env:
          UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
        run: test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"

      - name: Select the rootless static AppImage runtime
        working-directory: source
        run: git apply ../patches/static-appimage-runtime.patch

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          working-directory: source
          version-file: package.json
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --frozen-lockfile

      - name: Enable upstream production public configuration
        working-directory: source
        run: cp .env.example .env

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes imagemagick ripgrep

      - name: Build AppImage and updater metadata
        working-directory: source
        env:
          BUILD_VERSION: ${{ needs.resolve.outputs.version }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          vp run dist:desktop:artifact \
            --platform linux \
            --target AppImage \
            --arch arm64 \
            --build-version "$BUILD_VERSION"

      - name: Validate build outputs
        working-directory: source
        env:
          BUILD_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          appimage="release/T3-Code-${BUILD_VERSION}-arm64.AppImage"
          manifest="release/nightly-linux-arm64.yml"

          test -s "$appimage"
          test -s "$manifest"
          file "$appimage" | tee /dev/stderr | rg -q 'ARM aarch64'
          rg -q "^version: '?${BUILD_VERSION}'?$" "$manifest"
          rg -q "T3-Code-${BUILD_VERSION}-arm64\\.AppImage" "$manifest"

          # AppRun adds --no-sandbox when user namespaces are unavailable on a runner.
          # Electron's Node mode does not accept that Chromium flag, so make only this
          # architecture probe's namespace capability check deterministic.
          validation_bin="${RUNNER_TEMP}/t3code-appimage-validation-bin"
          mkdir -p "$validation_bin"
          ln -s /usr/bin/true "$validation_bin/unshare"
          runtime_arch="$(PATH="${validation_bin}:${PATH}" ELECTRON_RUN_AS_NODE=1 "$appimage" -e 'process.stdout.write(process.arch)')"
          test "$runtime_arch" = arm64

          (
            cd release
            sha256sum "T3-Code-${BUILD_VERSION}-arm64.AppImage" >SHA256SUMS
          )

      - name: Upload validated release files
        uses: actions/upload-artifact@v7
        with:
          name: t3code-arm64-release
          path: |
            source/release/T3-Code-${{ needs.resolve.outputs.version }}-arm64.AppImage
            source/release/nightly-linux-arm64.yml
            source/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  handoff:
    name: Prepare official Linux ARM64 handoff
    needs: resolve
    if: needs.resolve.outputs.mode == 'official'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download exact official release files
        env:
          BUILD_VERSION: ${{ needs.resolve.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir release
          gh release download "$RELEASE_TAG" \
            --repo pingdotgg/t3code \
            --dir release \
            --pattern "T3-Code-${BUILD_VERSION}-arm64.AppImage" \
            --pattern nightly-linux-arm64.yml

      - name: Validate official updater handoff
        env:
          APPIMAGE_DIGEST: ${{ needs.resolve.outputs.official_appimage_digest }}
          BUILD_VERSION: ${{ needs.resolve.outputs.version }}
          MANIFEST_DIGEST: ${{ needs.resolve.outputs.official_manifest_digest }}
        run: |
          set -euo pipefail
          appimage="release/T3-Code-${BUILD_VERSION}-arm64.AppImage"
          manifest="release/nightly-linux-arm64.yml"
          appimage_sha="${APPIMAGE_DIGEST#sha256:}"
          manifest_sha="${MANIFEST_DIGEST#sha256:}"

          test -s "$appimage"
          test -s "$manifest"
          printf '%s  %s\n' "$appimage_sha" "$appimage" | sha256sum --check
          printf '%s  %s\n' "$manifest_sha" "$manifest" | sha256sum --check
          file "$appimage" | tee /dev/stderr | grep -q 'ARM aarch64'
          grep -Eq "^version: '?${BUILD_VERSION}'?$" "$manifest"
          grep -q "T3-Code-${BUILD_VERSION}-arm64\.AppImage" "$manifest"

          chmod 0755 "$appimage"
          "$appimage" --appimage-extract >/dev/null
          update_config="squashfs-root/resources/app-update.yml"
          test -s "$update_config"
          grep -q '^owner: pingdotgg$' "$update_config"
          grep -q '^repo: t3code$' "$update_config"
          grep -q '^provider: github$' "$update_config"

          (
            cd release
            sha256sum "T3-Code-${BUILD_VERSION}-arm64.AppImage" >SHA256SUMS
          )

      - name: Upload validated release files
        uses: actions/upload-artifact@v7
        with:
          name: t3code-arm64-release
          path: |
            release/T3-Code-${{ needs.resolve.outputs.version }}-arm64.AppImage
            release/nightly-linux-arm64.yml
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ARM64 update release
    needs: [resolve, build, handoff]
    if: >-
      ${{
        always() &&
        needs.resolve.result == 'success' &&
        (needs.build.result == 'success' || needs.handoff.result == 'success')
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out feed repository
        uses: actions/checkout@v6

      - name: Download validated release files
        uses: actions/download-artifact@v8
        with:
          name: t3code-arm64-release
          path: release

      - name: Validate downloaded files
        env:
          BUILD_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          appimage="release/T3-Code-${BUILD_VERSION}-arm64.AppImage"
          test -s "$appimage"
          test -s release/nightly-linux-arm64.yml
          (cd release && sha256sum --check SHA256SUMS)
          file "$appimage" | tee /dev/stderr | grep -q 'ARM aarch64'

      - name: Record mirrored release
        env:
          MIRROR_MODE: ${{ needs.resolve.outputs.mode }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          printf '%s %s %s\n' "$RELEASE_TAG" "$UPSTREAM_SHA" "$MIRROR_MODE" >latest-nightly.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest-nightly.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: mirror ${RELEASE_TAG}"
            git push
          fi

      - name: Publish GitHub release
        env:
          FEED_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          MIRROR_MODE: ${{ needs.resolve.outputs.mode }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          target="$(git rev-parse HEAD)"
          if [[ "$MIRROR_MODE" == "official" ]]; then
            notes="Official Linux ARM64 files from pingdotgg/t3code@${RELEASE_TAG} (${UPSTREAM_SHA}), mirrored as an updater handoff for existing custom-feed installs. The embedded updater points directly to pingdotgg/t3code for subsequent releases."
          else
            notes="Unofficial Linux ARM64 build of pingdotgg/t3code@${RELEASE_TAG} (${UPSTREAM_SHA}). Uses electron-builder's static AppImage runtime so no host libfuse2 package is required."
          fi

          if gh release view "$RELEASE_TAG" --repo "$FEED_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release/T3-Code-*.AppImage \
              release/nightly-linux-arm64.yml \
              release/SHA256SUMS \
              --repo "$FEED_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$FEED_REPOSITORY" \
              --target "$target" \
              --title "T3 Code ARM64 Nightly ${RELEASE_TAG#v}" \
              --notes "$notes" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              release/T3-Code-*.AppImage \
              release/nightly-linux-arm64.yml \
              release/SHA256SUMS \
              --repo "$FEED_REPOSITORY" \
              --target "$target" \
              --title "T3 Code ARM64 Nightly ${RELEASE_TAG#v}" \
              --notes "$notes" \
              --prerelease
          fi
